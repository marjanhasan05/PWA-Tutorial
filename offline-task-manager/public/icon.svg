<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  <!-- Checkmark and Circle -->
  <g filter="url(#shadow)" transform="translate(64, 64)">
    <circle cx="192" cy="192" r="140" fill="#ffffff" />
    <!-- Checkmark path -->
    <path d="M120 185 l50 50 l100 -100" fill="none" stroke="#2563eb" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- Wireless signal or Offline indicator representing syncing -->
  <path d="M220 380 h72 M180 410 h152" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.8" />
</svg>
